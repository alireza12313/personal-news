 <!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورود | نبض</title>

    <link rel="stylesheet"
          href="style/style.css">

    <style>

        .login-page {
            min-height: calc(100vh - 76px);
            display: grid;
            place-items: center;
            padding: 30px;
        }

        .login-box {
            width: min(430px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.08);
        }

        .login-box h1 {
            margin-bottom: 8px;
        }

        .login-box p {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            border: 0;
            background: var(--primary);
            color: white;
            padding: 13px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }

    </style>

</head>

<body>

<header class="header">

    <div class="container nav">

        <a href="index.html" class="logo">
            <span class="logo-icon">ن</span>
            نبض
        </a>

        <a href="index.html">
            بازگشت به سایت ←
        </a>

    </div>

</header>


<main class="login-page">

    <div class="login-box">

        <span class="badge">
            حساب کاربری
        </span>

        <h1>
            خوش برگشتی 👋
        </h1>

        <p>
            برای ورود اطلاعاتت را وارد کن.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>
                    ایمیل
                </label>

                <input
                    type="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    رمز عبور
                </label>

                <input
                    type="password"
                    placeholder="••••••••"
                    required
                >

            </div>


            <button class="submit-btn">
                ورود به حساب
            </button>

        </form>

    </div>

</main>


<script src="js/script.js"></script>

<script>

const loginForm =
    document.getElementById("loginForm");

loginForm.addEventListener("submit", function(e) {

    e.preventDefault();

    localStorage.setItem(
        "loggedIn",
        "true"
    );

    window.location.href =
        "dashboard.html";

});

</script>

</body>
</html>
