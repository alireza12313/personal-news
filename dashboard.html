 <!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>پنل کاربری | نبض</title>

    <link rel="stylesheet"
          href="style/style.css">

    <style>

        .dashboard {
            padding: 50px 0;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .dashboard-header p {
            color: var(--muted);
        }

        .logout {
            background: #ff4757;
            color: white;
            border: 0;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 20px;
        }

        .dashboard-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 18px;
        }

        .dashboard-card span {
            font-size: 30px;
        }

        .dashboard-card strong {
            display: block;
            font-size: 28px;
            margin-top: 10px;
        }

        .dashboard-card p {
            color: var(--muted);
        }

        @media(max-width:700px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                align-items: flex-start;
                gap: 20px;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <div class="container nav">

        <a href="index.html" class="logo">
            <span class="logo-icon">ن</span>
            نبض
        </a>

        <a href="index.html">
            مشاهده سایت ←
        </a>

    </div>

</header>


<main class="dashboard">

    <div class="container">

        <div class="dashboard-header">

            <div>

                <span class="badge">
                    پنل کاربری
                </span>

                <h1>
                    سلام، خوش اومدی 👋
                </h1>

                <p>
                    وضعیت فعالیت حساب شما
                </p>

            </div>

            <button
                class="logout"
                id="logout">
                خروج
            </button>

        </div>


        <div class="dashboard-grid">

            <div class="dashboard-card">

                <span>❤️</span>

                <strong>۲۴</strong>

                <p>
                    مطالب مورد علاقه
                </p>

            </div>


            <div class="dashboard-card">

                <span>💬</span>

                <strong>۱۲</strong>

                <p>
                    دیدگاه‌های شما
                </p>

            </div>


            <div class="dashboard-card">

                <span>🔔</span>

                <strong>۵</strong>

                <p>
                    اعلان جدید
                </p>

            </div>


            <div class="dashboard-card">

                <span>👁️</span>

                <strong>1,248</strong>

                <p>
                    بازدید مطالب
                </p>

            </div>


            <div class="dashboard-card">

                <span>📚</span>

                <strong>۳۶</strong>

                <p>
                    مطالب ذخیره شده
                </p>

            </div>


            <div class="dashboard-card">

                <span>⭐</span>

                <strong>۴.۸</strong>

                <p>
                    امتیاز فعالیت
                </p>

            </div>

        </div>

    </div>

</main>


<script>

const loggedIn =
    localStorage.getItem("loggedIn");

if (loggedIn !== "true") {
    window.location.href =
        "login.html";
}


document
    .getElementById("logout")
    .addEventListener("click", () => {localStorage.removeItem(
            "loggedIn"
        );

        window.location.href =
            "login.html";

    });

</script>

</body>

</html>
